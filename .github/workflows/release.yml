name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-and-release:
    name: Build & Package DMG
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Extract Version
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package DMG
        run: |
          chmod +x scripts/package-dmg.sh
          ./scripts/package-dmg.sh "${{ steps.get_version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PrivacyScreen v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist/PrivacyScreen-v${{ steps.get_version.outputs.version }}.dmg
            dist/PrivacyScreen-v${{ steps.get_version.outputs.version }}.dmg.sha256
          generate_release_notes: true
